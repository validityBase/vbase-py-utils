# Generated from validityBase/github-configuration templates.
# Do not edit rendered files manually; update the source template in validityBase/github-configuration.
version: 2
updates:
  - package-ecosystem: "pip"
    # Scan repo root for package metadata requirements.in and /requirements
    # for pip-compile terminal environment inputs/outputs.
    directories:
      - "/"
      - "/requirements"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Etc/UTC"
    versioning-strategy: "increase-if-necessary"
    groups:
      pip-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      pip-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      - dependency-name: "pip"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
